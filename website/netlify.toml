# Netlify — marketing site + downloads

[build]
  base = "website"
  publish = "."
  command = "node scripts/netlify-build.mjs"

[build.environment]
  NODE_VERSION = "22"
  QV_WEB_APP_URL = "https://questvault.lypes.agency"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
